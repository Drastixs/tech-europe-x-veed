[project]
name = "onshape-assist-backend"
version = "0.1.0"
description = "Local command relay and API boilerplate for the Onshape Assist browser extension."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "fal-client>=0.5,<1",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onshape_assist"]

[project.scripts]
overlayctl = "onshape_assist.cli:main"
analyzectl = "onshape_assist.analysis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
